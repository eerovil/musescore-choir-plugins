<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    // `viewport-fit=cover` is what lets the installed app paint under the notch and
    // the home indicator, and pwa.css pads those safe areas back. In an ordinary
    // browser tab it does the opposite of a favour: the page's bottom edge moves
    // under the browser's own toolbar, and the workspace's pane-switcher bar sits
    // exactly there, so it goes with it (#54). Opt in only where the app owns the
    // whole screen. Inline and in the head, so the viewport is settled before the
    // first paint rather than after a visible reflow.
    (() => {
      const standalone = window.navigator.standalone === true
        || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      if (!standalone) return;
      document.getElementById("viewport").setAttribute(
        "content", "width=device-width, initial-scale=1, viewport-fit=cover");
    })();
  </script>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#14151a" />
  <meta name="apple-mobile-web-app-title" content="Choir" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>song</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/pwa.css" />
</head>
<body>
  <header>
    <a href="#/" class="brand">♪ song</a>
    <span id="crumb"></span>
    <button id="agentdeck-action" class="new-issue-link" type="button"
            style="display:none;margin-left:auto;background:transparent;font:inherit;cursor:pointer">
      AgentDeck
    </button>
    <a class="new-issue-link"
       style="margin-left:0"
       href="https://github.com/eerovil/musescore-choir-plugins/issues/new?template=issue-for-agent-to-fix.md"
       target="_blank" rel="noopener"
       aria-label="Create musescore-choir-plugins GitHub issue"
       title="Create musescore-choir-plugins GitHub issue">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
      </svg>
      <span>New issue</span>
    </a>
  </header>
  <!-- Why the AgentDeck action cannot act. A title tooltip cannot say this on a
       phone, which is where the app is actually used (#52). -->
  <div id="agentdeck-note" role="status" hidden></div>
  <main id="app">Loading…</main>
  <script src="/app.js"></script>
  <script>
    (() => {
      const action = document.getElementById("agentdeck-action");
      const note = document.getElementById("agentdeck-note");
      let current = null;
      let currentSlug = "";

      const say = (message) => {
        note.textContent = message || "";
        note.hidden = !message;
      };

      const slugFromHash = () => {
        const match = location.hash.match(/^#\/song\/(.+)$/);
        return match ? decodeURIComponent(match[1]) : "";
      };

      const request = async (path, options) => {
        const response = await fetch(path, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || response.statusText);
        return body;
      };

      // The two states a tap can act on. Everything else either opens a stored
      // link or has nothing to open — and must say so rather than going quiet.
      const canCreate = (status) =>
        status.state === "unmapped" || status.state === "stale";

      const draw = (status) => {
        current = status;
        action.disabled = false;
        action.style.display = currentSlug ? "inline-flex" : "none";
        if (!currentSlug) return;
        if (status.state === "unmapped") {
          action.textContent = "+ AgentDeck";
          action.title = "Create an AgentDeck chat for this song";
        } else if (status.state === "starting") {
          action.textContent = "AgentDeck…";
          action.title = "Open the AgentDeck chat while it starts";
        } else if (status.state === "ready") {
          action.textContent = "AgentDeck";
          action.title = "Open this song's AgentDeck chat";
        } else if (status.state === "stale") {
          action.textContent = "Recreate AgentDeck";
          action.title = status.detail || "The mapped AgentDeck chat no longer exists";
        } else if (status.state === "unavailable" && status.url) {
          action.textContent = "AgentDeck ?";
          action.title = status.detail || "Could not verify AgentDeck; open the stored link anyway";
        } else {
          // No link to open and nothing to create — typically AgentDeck is not
          // configured on this host. This used to disable the button and put the
          // reason in a title tooltip, which a phone never shows, so the report
          // was simply "the AgentDeck button does nothing" (#52). Stay clickable
          // and mark it, so a tap can hand over the server's own sentence.
          action.textContent = "AgentDeck ⚠";
          action.title = status.detail || "AgentDeck is not available";
        }
      };

      const refresh = async () => {
        const slug = slugFromHash();
        currentSlug = slug;
        current = null;
        say("");
        if (!slug) {
          action.style.display = "none";
          return;
        }
        action.style.display = "inline-flex";
        action.disabled = true;
        action.textContent = "AgentDeck…";
        try {
          draw(await request(`/api/songs/${encodeURIComponent(slug)}/agentdeck`));
        } catch (error) {
          draw({ state: "unavailable", url: null, detail: error.message });
        }
      };

      action.addEventListener("click", async () => {
        if (!currentSlug || !current || action.disabled) return;
        if (current.url && !canCreate(current)) {
          location.href = current.url;
          return;
        }
        if (!canCreate(current)) {
          say(current.detail || "AgentDeck is not available for this song.");
          return;
        }
        say("");
        action.disabled = true;
        action.textContent = current.state === "stale" ? "Recreating…" : "Creating…";
        try {
          const result = await request(
            `/api/songs/${encodeURIComponent(currentSlug)}/agentdeck`,
            {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ replace: current.state === "stale" }),
            },
          );
          draw(result);
          if (result.url) location.href = result.url;
        } catch (error) {
          await refresh();
          say(error.message);
        }
      });

      window.addEventListener("hashchange", refresh);
      window.addEventListener("DOMContentLoaded", refresh);
    })();
  </script>
  <script src="/rendering_state.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
